<text x="24.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="bold" fill="#1f2933" xml:space="preserve">How two OSPF routers become neighbours</text>
<text x="24.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#5b6773" xml:space="preserve">Like two new colleagues: greet, agree, compare notes, copy what's missing, then work as one team.</text>
<text x="84.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff" xml:space="preserve">Down</text>
<text x="84.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">nothing heard</text>
<text x="206.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff" xml:space="preserve">Init</text>
<text x="206.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">heard a Hello</text>
<text x="328.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff" xml:space="preserve">2-Way</text>
<text x="328.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">saw myself in</text>
<text x="328.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">their Hello</text>
<text x="450.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff" xml:space="preserve">ExStart</text>
<text x="450.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">who leads the</text>
<text x="450.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">exchange?</text>
<text x="572.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff" xml:space="preserve">Exchange</text>
<text x="572.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">swap database</text>
<text x="572.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">summaries (DBD)</text>
<text x="694.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff" xml:space="preserve">Loading</text>
<text x="694.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">request missing</text>
<text x="694.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">LSAs</text>
<text x="816.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff" xml:space="preserve">Full</text>
<text x="816.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">identical maps.</text>
<text x="816.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">Done!</text>
<text x="42.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933" xml:space="preserve">On a LAN (broadcast network)</text>
<text x="42.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" xml:space="preserve">Routers elect a DR and a BDR. Others (DROTHER)</text>
<text x="42.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" xml:space="preserve">stay at 2-Way with each other and go Full only</text>
<text x="42.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" xml:space="preserve">with the DR and BDR. Highest priority wins, then RID.</text>
<text x="472.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933" xml:space="preserve">Neighbours only form when they agree on</text>
<text x="472.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" xml:space="preserve">area ID, subnet and mask, hello/dead timers,</text>
<text x="472.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" xml:space="preserve">authentication, and (in practice) MTU.</text>
<text x="472.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" xml:space="preserve">Wrong area = they never get past Init.</text>
