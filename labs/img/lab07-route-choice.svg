<text x="24.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="bold" fill="#1f2933" xml:space="preserve">How a router chooses a route</text>
<text x="24.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#5b6773" xml:space="preserve">Rule 1: the LONGEST matching prefix wins. Rule 2: on a tie, the LOWEST administrative distance wins.</text>
<text x="40.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" font-weight="bold" fill="#1f2933" xml:space="preserve">Packet to 10.3.3.13 arrives at R1. Candidate routes:</text>
