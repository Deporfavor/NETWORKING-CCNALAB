<text x="220.0" y="184.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2933" xml:space="preserve">via 10.0.12.2</text>
<text x="400.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2933" xml:space="preserve">matches: first 24 bits equal</text>
<text x="845.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" font-weight="bold" fill="#4a90d9" xml:space="preserve">24 bits</text>
<text x="56.0" y="226.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933" xml:space="preserve">10.3.3.13/32</text>
