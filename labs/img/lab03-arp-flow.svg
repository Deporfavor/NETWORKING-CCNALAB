<text x="24.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="bold" fill="#1f2933" xml:space="preserve">What happens when PC1 pings PC2 for the first time</text>
<text x="24.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#5b6773" xml:space="preserve">Broadcasts go to every port. Replies go only where the switch has learned the MAC address.</text>
<text x="110.0" y="71.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">PC1</text>
<text x="330.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">SW1</text>
<text x="560.0" y="71.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">PC2</text>
<text x="700.0" y="71.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">PC3</text>
<text x="820.0" y="71.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">PC4</text>
<text x="122.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#c05621" xml:space="preserve">1. ARP request (broadcast): "Who has 10.0.0.12?"</text>
<text x="342.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#c05621" xml:space="preserve">2. Switch learns PC1 is on e1, floods out every other port</text>
<text x="548.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="bold" fill="#1d5fbf" xml:space="preserve">3. ARP reply (unicast): "10.0.0.12 is at my MAC"</text>
<text x="342.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1d5fbf" xml:space="preserve">4. Switch learns PC2 is on e2, sends the reply ONLY to e1</text>
<text x="122.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#2f855a" xml:space="preserve">5. Ping (ICMP) to PC2's MAC</text>
<text x="342.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#2f855a" xml:space="preserve">6. Known MAC: sent to e2 only</text>
<rect x="40.0" y="465.0" width="420.0" height="108.0" rx="8" fill="#f1f3f5" stroke="#b8c2cc" stroke-width="1"/>
<text x="52.0" y="487.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" xml:space="preserve">SW1 MAC address table after step 4</text>
<text x="52.0" y="509.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" xml:space="preserve">Vlan  Mac Address     Port</text>
<text x="52.0" y="529.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" xml:space="preserve">  1   PC1's MAC       e1</text>
<text x="52.0" y="549.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" xml:space="preserve">  1   PC2's MAC       e2</text>
</svg>