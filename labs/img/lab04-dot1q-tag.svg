<text x="656.2" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">VLAN ID</text>
<text x="656.2" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5b6773" xml:space="preserve">12 bits</text>
<text x="656.2" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">1 - 4094 (12 bits)</text>
<text x="450.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#9c4221" xml:space="preserve">Native VLAN frames cross the trunk WITHOUT a tag, which is why both ends must agree on it.</text>
