<text x="285.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">TPID 0x8100</text>
<text x="285.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5b6773" xml:space="preserve">16 bits</text>
<text x="285.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">"a tag follows"</text>
<text x="480.9" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">PRI</text>
<text x="480.9" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5b6773" xml:space="preserve">3 bits</text>
<text x="480.9" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2933" xml:space="preserve">priority (QoS)</text>
<text x="522.2" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">DEI</text>
<text x="522.2" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5b6773" xml:space="preserve">1 bit</text>
