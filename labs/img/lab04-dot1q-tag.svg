<text x="24.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="bold" fill="#1f2933" xml:space="preserve">Inside a trunk: the 802.1Q tag</text>
<text x="24.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#5b6773" xml:space="preserve">The switch slips a 4-byte label into the frame, like a coloured sticker on a parcel.</text>
<text x="116.7" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">Dest MAC</text>
