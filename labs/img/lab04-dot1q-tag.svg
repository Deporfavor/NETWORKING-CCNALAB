<text x="250.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">Source MAC</text>
<text x="250.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5b6773" xml:space="preserve">6 bytes</text>
<text x="361.1" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">802.1Q tag</text>
<text x="361.1" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5b6773" xml:space="preserve">4 bytes</text>
<text x="427.8" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">Type</text>
<text x="427.8" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5b6773" xml:space="preserve">2 bytes</text>
<text x="605.6" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">Data (IP packet)</text>
