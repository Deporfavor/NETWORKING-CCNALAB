<text x="24.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#5b6773" xml:space="preserve">Your codespace is one Linux computer. netlab divides it into sealed rooms, one per device.</text>
