<text x="24.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#5b6773" xml:space="preserve">Like a new tenant asking the landlord for a room.</text>
<text x="140.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">PC1</text>
<text x="140.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5b6773" xml:space="preserve">client (no address)</text>
<text x="700.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">R1</text>
<text x="700.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5b6773" xml:space="preserve">DHCP server 192.168.1.1</text>
<text x="420.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#c05621" xml:space="preserve">1. DISCOVER (broadcast)   "Is there a DHCP server?"</text>
<text x="420.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d5fbf" xml:space="preserve">2. OFFER   "You can have 192.168.1.100"</text>
<text x="420.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#c05621" xml:space="preserve">3. REQUEST (broadcast)   "Yes please, I'll take .100"</text>
<text x="420.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#2f855a" xml:space="preserve">4. ACK   "It's yours for 12 h. Gateway .1, DNS .1"</text>
