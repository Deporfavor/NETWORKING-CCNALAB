<text x="24.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#5b6773" xml:space="preserve">The packet travels up the same cable twice: once tagged 10, once tagged 20.</text>
<text x="90.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">PC1</text>
<text x="90.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5b6773" xml:space="preserve">VLAN 10</text>
<text x="330.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">SW1</text>
<text x="620.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">R1</text>
<text x="820.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" xml:space="preserve">PC2</text>
<text x="820.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5b6773" xml:space="preserve">VLAN 20</text>
<text x="198.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#2f855a" xml:space="preserve">1. untagged</text>
<text x="410.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#2f855a" xml:space="preserve">2. trunk: tag 10</text>
<text x="505.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#7b3fbf" xml:space="preserve">4. trunk: tag 20</text>
<text x="640.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#7b3fbf" xml:space="preserve">5. untagged to e2</text>
<text x="672.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933" xml:space="preserve">3. R1 routes it</text>
<text x="672.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2933" xml:space="preserve">arrives on e0.10, routing table</text>
<text x="672.0" y="215.6" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2933" xml:space="preserve">says 192.168.20.0/24 is on e0.20</text>
