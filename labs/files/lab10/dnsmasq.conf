# DHCP server for the STUDENTS VLAN (VLAN 20), running on R1's sub-interface e0.20.
# Start (or restart after editing) with:
#     net R1 dhcp-server my-work/lab10/dnsmasq.conf
interface=e0.20
bind-interfaces
no-resolv
no-hosts
dhcp-range=192.168.20.100,192.168.20.150,255.255.255.0,4h
dhcp-option=option:router,192.168.21.1
dhcp-option=option:dns-server,192.168.20.1
dhcp-authoritative
log-dhcp
