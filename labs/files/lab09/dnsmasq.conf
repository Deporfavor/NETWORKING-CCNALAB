# DHCP + DNS server for the campus LAN (lab 9). It runs on R1.
# Replace every ___ with the right value, save (Ctrl+S), then start it with:
#     net R1 dhcp-server my-work/lab09/dnsmasq.conf
# Lines starting with # are comments.

# Serve only the inside LAN, never the ISP link.
interface=e0
bind-interfaces
# This server only answers for names written below. It does not ask anyone else.
no-resolv
no-hosts

# ---------- DHCP ----------
# 1. The pool: first address, last address, subnet mask, lease time.
#    Pool = 192.168.1.100 to 192.168.1.150, lease 12 hours (12h).
dhcp-range=___,___,___,12h

# 2. Option 3: the default gateway the clients should use (R1's inside address).
dhcp-option=option:router,___

# 3. Option 6: the DNS server the clients should use (also R1 here).
dhcp-option=option:dns-server,___

domain=campus.lan
dhcp-authoritative
log-dhcp

# ---------- DNS ----------
# 4. A record: web.isp.example lives at the Internet server's address.
address=/web.isp.example/___
address=/r1.campus.lan/192.168.1.1
